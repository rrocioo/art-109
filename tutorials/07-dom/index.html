<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM-ing javascript</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1 id="header">Maya... I love Maya...</h1>
        <button id="changeHeaderButton">la la la</button>
    </header>
    <main>
        <button id="changeThemeButton">Switch to Dark Theme</button>
        <img src="images/Lopez_Rocio_Pose1_Run.png" alt="Running pose" id="img1">
        <img src="images/Lopez_Rocio_Pose2_Sneak.png" alt="Sneaking pose" class="hidden" id="img2">
        <img src="images/Lopez_Rocio_Pose03_torero.png" alt="Torero pose" class="hidden" id="img3">
        <img src="images/Lopez_Rocio_Pose4_Skate.png" alt="Ice skating pose" class="hidden" id="img4">
        <img src="images/Lopez_Rocio_Pose5_Desperate.png" alt="Desperate pose" class="hidden" id="img5">
        <img src="images/Lopez_Rocio_Pose06_Flamenco.png" alt="Flamenco dance pose" class="hidden" id="img6">
        <img src="images/Lopez_Rocio_Pose7_HeavyLift.png" alt="Lifting a box pose" class="hidden" id="img7">
        <img src="images/Lopez_Rocio_Pose8_Sitting.png" alt="Lounging pose" class="hidden" id="img8">
        <img src="images/Lopez_Rocio_Pose9_Climbing.png" alt="Climbing pose" class="hidden" id="img9">
        <img src="images/Lopez_Rocio_Pose10_Fave.png" alt="Favorite pose" class="hidden" id="img10">
    </main>
    <script src="js/main.js"></script>
</body>
</html>
