<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Day</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-container">
        <img class="main-img" src="images/eyes-closed.png" alt="closed eyes">
        <div id="wake-up">
            <p>Wake Up</p>
            <button id="change-main-img">Okay.</button>
        </div>
    </div>
    <div hidden id="bedup" class="pop-up">
            <header class="pop-up-header">Stay in bed?</header>
            <button id="backToBed">Yes</button>
            <button id="wakeUp">No</button>
    </div>
    <div hidden id="areUSure" class="pop-up">
        <header class="pop-up-header">Are you sure?</header>
        <button id="wakeUp">Yes</button>
        <button id="backToBed">No</button>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
