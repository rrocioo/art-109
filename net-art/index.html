<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go back to bed</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-container">
        <img class="main-img" src="images/eyes-closed.png" alt="closed eyes">
        <div id="wake-up">
            <p>Wake Up</p>
            <button id="change-main-img">Okay.</button>
        </div>
    </div>
    <div hidden id="bedup" class="pop-up">
            <header class="pop-up-header">Stay in bed?</header>
            <div class="flex-pop">
                <button id="sleep">Yes</button>
                <button id="wakeUp">No</button>
            </div>
    </div>
    <div hidden id="areUSure" class="pop-up">
        <header class="pop-up-header">Are you sure?</header>
        <div class="flex-pop">
            <button id="imSure">Yes</button>
            <button id="sleep2">No</button>
        </div>
    </div>
        <div hidden id="definitely" class="pop-up">
        <header class="pop-up-header">Are you for sure for sure?</header>
        <div class="flex-pop">
            <button id="imSure2">Yes</button>
            <button id="sleep3">No</button>
        </div>
    </div>
    <div hidden id="butYourBed" class="pop-up">
        <header class="pop-up-header">But your bed...</header>
        <div class="flex-pop">
            <button id="sleep4">My bed</button>
            <button id="imSure3">Get up.</button>
        </div>
    </div>
    <div hidden id="itsSoWarm" class="pop-up">
        <header class="pop-up-header">It's so warm...</header>
        <div class="flex-pop">
            <button id="sleep5">Sleep</button>
            <button id="imSure4">Get Up.</button>
        </div>
    </div>
    <div hidden id="justGoBack" class="pop-up">
        <header class="pop-up-header">You should just go back to bed.</header>
        <div class="flex-pop">
            <button id="imSure5">No</button>
            <button id="sleep6">Sure</button>
        </div>
    </div>
    <div hidden id="toBed" class="pop-up">
        <header class="pop-up-header">Go back</header>
        <div class="flex-pop">
            <button id="sleep7">Okay</button>
            <button id="imSure6">No</button>
        </div>
    </div>
    <div hidden id="andDontLeave" class="pop-up">
        <header class="pop-up-header">And don't get up</header>
        <div class="flex-pop">
            <button id="sleep8">Okay</button>
            <button id="dontWork">get up...</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
